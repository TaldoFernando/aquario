<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Aquário</title><link rel="stylesheet" href="popup.css?v=12"></head><body>
<header><div><small>UM PEQUENO INTERVALO</small><h1>Seu aquário<span>✧</span></h1></div><span class="pill" id="phase">Luz do dia</span></header>
<section class="tank"><canvas id="tank" width="560" height="290" aria-label="Prévia do aquário"></canvas><div class="tank-label">Respire. Deixe a água levar.</div></section>
<div class="tank-actions"><button id="scale">Escala: fictícia</button></div>
<main><div class="row"><h2>Habitantes</h2><span id="count">0 espécies</span></div><p class="muted">Um lugar para cada pequena vida.</p><div id="selected"></div>
<label for="species-toggle">Adicionar ao aquário</label><div class="row"><div class="combo" id="combo"><button id="species-toggle" type="button" aria-haspopup="listbox" aria-expanded="false"><img id="species-thumb" alt="" hidden><span id="species-label">Escolher…</span><span class="caret">▾</span></button><div class="combo-list" id="species" role="listbox" hidden></div><div class="combo-preview" id="species-preview" hidden><img alt=""></div></div><button id="add" aria-label="Adicionar espécie">+</button></div><p class="muted" id="available"></p>
<div class="settings"><div><strong>Luz que acompanha o seu dia</strong><p id="location">Ciclo aproximado pelo horário local</p></div><button id="geo">Usar localização</button></div>
<div class="manual">
<label for="clock">Hora do dia</label><div class="row"><input type="text" id="clock" inputmode="numeric" maxlength="5" placeholder="HHMM" autocomplete="off"><button type="button" id="clock-apply" class="mini">Confirmar</button><button type="button" id="clock-reset" class="mini">Agora</button></div>
<label for="place">Localização</label><select id="place">
<option value="device">Usar do dispositivo</option>
<option value="-23.55,-46.63">São Paulo</option>
<option value="-22.91,-43.17">Rio de Janeiro</option>
<option value="-15.78,-47.93">Brasília</option>
<option value="-12.97,-38.50">Salvador</option>
<option value="-8.05,-34.88">Recife</option>
<option value="-3.10,-60.02">Manaus</option>
<option value="-30.03,-51.23">Porto Alegre</option>
<option value="-1.46,-48.49">Belém</option>
<option value="-3.73,-38.53">Fortaleza</option>
<option value="-25.43,-49.27">Curitiba</option>
<option value="custom">Personalizado…</option>
</select>
<div class="row" id="custom-place" hidden><input type="number" id="lat" step="0.01" min="-90" max="90" placeholder="Latitude"><input type="number" id="lon" step="0.01" min="-180" max="180" placeholder="Longitude"></div>
</div>
<div class="row"><button id="float">Abrir / fechar na página</button><button id="pause">Pausar</button></div><p id="message" role="status" aria-live="polite"></p>
</main><footer>Sem pressa. Só um pouco de natureza.</footer>
<script src="solar.js?v=12"></script><script src="renderer.js?v=12"></script><script src="popup.js?v=12"></script></body></html>
