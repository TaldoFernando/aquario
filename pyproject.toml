[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquario"
version = "0.1.0"
description = "Aquário virtual: sprites, recuperação vetorial e extensão MV3"
requires-python = ">=3.9"
dependencies = ["Pillow>=10,<12", "numpy>=1.24,<3", "fastapi>=0.115,<0.120", "uvicorn>=0.30,<0.36", "lancedb>=0.20,<0.25", "sentence-transformers>=3.4,<4", "httpx>=0.27,<0.29"]

[project.optional-dependencies]
gpu = ["torch>=2.6", "diffusers>=0.35", "transformers>=4.51", "accelerate>=1.5", "peft>=0.15", "rembg>=2.0", "onnxruntime>=1.20"]
test = ["pytest>=8"]

[project.scripts]
aquario = "aquarium.cli:main"

[tool.setuptools.packages.find]
include = ["aquarium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
